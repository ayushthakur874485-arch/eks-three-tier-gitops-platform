services:
  mongodb:
    image: mongo:7
    container_name: task-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build: ./app/backend
    container_name: task-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/taskdb
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ./app/frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: task-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:

networks:
  app-network: