name: Build and Push Docker Images to ECR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'gitops/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    name: Build, Push and Update Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/task-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          build-args: |
            VITE_API_URL=.
          tags: ${{ steps.login-ecr.outputs.registry }}/task-frontend:${{ github.sha }}

      - name: Update image tags in manifests
        run: |
          sed -i -E "s|(image: .*/task-backend:).*|\1${{ github.sha }}|" k8s/backend/backend.yaml
          sed -i -E "s|(image: .*/task-frontend:).*|\1${{ github.sha }}|" k8s/frontend/frontend.yaml
          git diff --stat

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s
          git commit -m "ci: deploy ${GITHUB_SHA::7} [skip ci]" || echo "No changes to commit"
          git push